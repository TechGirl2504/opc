<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/cnmis-logo.svg" type="image/svg+xml">
    <link rel="alternate icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Change of Name Management Information System for OPC">
    <meta name="theme-color" content="#12385f">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CNMIS">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/mask-icon.svg" color="#12385f">
    
    <title>CNMIS - Change of Name Management</title>
    <style>
      /* Prevent "dashboard flash" on hard refresh by keeping the SPA hidden
         until router/auth boot completes (see `src/main.ts`). */
      html:not([data-app-ready="true"]) #app {
        display: none;
      }
      html:not([data-app-ready="true"]) #boot-splash {
        display: flex;
      }
      #boot-splash {
        display: none;
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at top right, rgba(18, 56, 95, 0.08), transparent 30%),
          linear-gradient(180deg, #eef3f8 0%, #f7fafc 100%);
        color: #0f172a;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">Loading…</div>
    <div id="app"></div>
    <script src="/env.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
