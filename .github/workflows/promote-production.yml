name: Promote (production) — retag staging → production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image names (lowercase)
        shell: bash
        run: |
          echo "IMAGE_BACKEND=${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_ENV"
          echo "IMAGE_FRONTEND=${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"

      - name: Retag backend (staging → production)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:production" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:staging"

      - name: Retag frontend (staging → production)
        run: |
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:production" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:staging"

